name: kiosk
description: "free-kiosk ebook 2장 완료본"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.3
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - data/config/store.json
    - data/config/tables.json
    - data/menu/menu_items.json
    - data/orders/active.json
    - data/history/order_archive.json
    - data/images_menu/
